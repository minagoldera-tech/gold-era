<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>خزائن الذهب</title>
<meta name="theme-color" content="#1F3A31">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
/* Layout: sticky vault bar (name + branch switch + tabs) over a single working column; tables scroll inside their own frames. */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface2:#EEF0EB; --line:#D9DDD4; --fg:#1C2621; --muted:#5E6A63;
  --vault:#1F3A31; --vault-fg:#F1EBDA; --gold:#A47816; --gold-soft:#F4E9CC; --gold-fg:#5C4208;
  --ok:#2E7D4F; --ok-soft:#E1F1E7; --warn:#A86A00; --warn-soft:#FBEFD6; --bad:#B3261E; --bad-soft:#F9E1DF;
  --display:Tahoma,"Segoe UI",Arial,sans-serif; --body:Tahoma,"Segoe UI",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#171E1B; --surface2:#1E2723; --line:#2C3833; --fg:#E7EAE5; --muted:#9AA79F;
  --vault:#13261F; --vault-fg:#EDE3C6; --gold:#D8B04A; --gold-soft:#3A3018; --gold-fg:#F0D58A;
  --ok:#5CC48A; --ok-soft:#173326; --warn:#E6A93B; --warn-soft:#3A2C12; --bad:#F07A70; --bad-soft:#3B1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171E1B; --surface2:#1E2723; --line:#2C3833; --fg:#E7EAE5; --muted:#9AA79F;
  --vault:#13261F; --vault-fg:#EDE3C6; --gold:#D8B04A; --gold-soft:#3A3018; --gold-fg:#F0D58A;
  --ok:#5CC48A; --ok-soft:#173326; --warn:#E6A93B; --warn-soft:#3A2C12; --bad:#F07A70; --bad-soft:#3B1C1A; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--vault)}
.num,td,.tile b{font-variant-numeric:tabular-nums}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--vault);color:var(--vault-fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--display);font-size:22px;margin:0;letter-spacing:0}
.brand small{display:block;font-size:12px;opacity:.75}
.ingot{width:34px;height:22px;flex:none}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:3px}
.seg button{background:none;border:0;color:inherit;font:inherit;font-size:14px;padding:5px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:#1B1405;font-weight:600}
nav.tabs{max-width:1180px;margin:8px auto 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{color:var(--vault-fg);opacity:.72;text-decoration:none;padding:9px 14px 11px;white-space:nowrap;border-bottom:3px solid transparent;font-size:14.5px}
nav.tabs a[aria-current="page"]{opacity:1;border-bottom-color:var(--gold);font-weight:600}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--display);font-size:21px;margin:0;text-wrap:balance}
h3{font-size:16px;margin:0;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile span{font-size:12.5px;color:var(--muted)} .tile b{font-size:22px;font-weight:600}
.tile i{font-style:normal;font-size:12.5px;color:var(--gold-fg);background:var(--gold-soft);align-self:flex-start;border-radius:4px;padding:0 6px}
.branch-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:10px;gap:8px;flex-wrap:wrap}
.branch-total b{font-size:20px;color:var(--gold)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface2);font-weight:600;font-size:13px;color:var(--muted);position:sticky;top:0}
th.grp{color:var(--fg);border-bottom:2px solid var(--gold)}
td.name,th.name{text-align:right;font-weight:500}
tr.tot td{background:var(--gold-soft);color:var(--gold-fg);font-weight:600}
td.neg{color:var(--bad);font-weight:700;background:var(--bad-soft)}
td.zero{color:var(--muted)}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;font-weight:500;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.gold{background:var(--gold-soft);color:var(--gold-fg)} .chip.plain{background:var(--surface2);color:var(--muted)}
.alerts{display:flex;flex-direction:column;gap:6px;max-height:360px;overflow:auto}
.alert{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--surface2);flex-wrap:wrap}
.alert .t{flex:1;min-width:140px}
.alert.bad{border-inline-start:4px solid var(--bad)} .alert.warn{border-inline-start:4px solid var(--warn)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input[type=number]{direction:ltr;text-align:center}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.btn{font:inherit;font-size:14.5px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--vault);color:var(--vault-fg);border-color:var(--vault)}
.btn.gold{background:var(--gold);color:#1B1405;border-color:var(--gold);font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 110px auto auto;gap:8px;align-items:center}
.line .avail{font-size:12.5px;color:var(--muted);min-width:90px}
@media (max-width:560px){.line{grid-template-columns:minmax(0,1fr) 90px auto}.line .avail{grid-column:1/-1;order:5}.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.tile b{font-size:18px}}
.note{padding:10px 12px;border-radius:8px;font-size:14px}
.note.bad{background:var(--bad-soft);color:var(--bad)} .note.warn{background:var(--warn-soft);color:var(--warn)} .note.info{background:var(--gold-soft);color:var(--gold-fg)}
.moves{display:flex;flex-direction:column;gap:8px}
.move{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.move.void{opacity:.55} .move.void .ml{text-decoration:line-through}
.move .mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.move .ml{font-size:14px}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--vault);color:var(--vault-fg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
@media (prefers-reduced-motion:no-preference){.panel{animation:rise .25s ease-out both}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-size:15px}
img{max-width:100%}[hidden]{display:none!important}
.user{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.user button{background:none;border:1px solid rgba(255,255,255,.25);color:inherit;font:inherit;font-size:12.5px;border-radius:999px;padding:3px 10px;cursor:pointer}
.sync{font-size:12px;border-radius:999px;padding:2px 9px;white-space:nowrap}
.sync.on{background:rgba(92,196,138,.18);color:#BDEBCF}.sync.wait{background:rgba(230,169,59,.2);color:#F6D8A0}.sync.off{background:rgba(240,122,112,.22);color:#FFC9C3}
.login{max-width:420px;margin:8vh auto 0;width:100%}
.brand.big h2{font-size:26px}.brand.big .ingot{width:46px;height:30px}
details.first{border-top:1px dashed var(--line);padding-top:10px}
details.first summary{cursor:pointer;color:var(--gold-fg);font-size:14px}
details.first[open]{display:flex;flex-direction:column;gap:8px}

/* --- stock: toolbar, kpis, distribution, cards --- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.toolbar label{flex:1 1 150px}.toolbar label.grow{flex:2 1 180px}
.seg2{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg2 button{background:none;border:0;font:inherit;font-size:14px;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg2 button[aria-pressed="true"]{background:var(--vault);color:var(--vault-fg);font-weight:600}
.seg2.wide{display:flex}.seg2.wide button{flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:12.5px;color:var(--muted)}.kpi b{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--gold)}
.kpi i{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--bad)}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi b{font-size:22px}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px}
.sw.main,.seg-bar.main{background:var(--vault)}.sw.sub,.seg-bar.sub{background:var(--gold)}.sw.show,.seg-bar.show{background:#C9B88A}
:root[data-theme="dark"] .sw.main,:root[data-theme="dark"] .seg-bar.main{background:#3F7A63}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sw.main,:root:not([data-theme="light"]) .seg-bar.main{background:#3F7A63}}
.distrow{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;align-items:center}
.dn{font-weight:600;font-size:14px}.dv{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.track{height:16px;background:var(--surface2);border-radius:999px;display:flex;overflow:hidden}
.seg-bar{height:100%}.seg-bar.dim{opacity:.25}
.distnums{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding-inline-start:80px;margin-top:-6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;border-inline-start:4px solid var(--ok);min-width:0}
.card.sev-warn{border-inline-start-color:var(--warn)}.card.sev-bad{border-inline-start-color:var(--bad)}.card.off{opacity:.6}
.ch{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ch h4{margin:0;font-size:15.5px;font-weight:600}.wt{font-size:12px;color:var(--gold-fg);background:var(--gold-soft);border-radius:4px;padding:0 6px;white-space:nowrap}
.big{display:flex;align-items:baseline;gap:6px}.big b{font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}.big span{color:var(--muted);font-size:13px}.big em{font-style:normal;margin-inline-start:auto;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.mbar{height:4px;background:var(--surface2);border-radius:999px;overflow:hidden}.mbar div{height:100%;background:var(--gold)}
.br{display:flex;flex-direction:column;gap:4px}.bn{font-size:12px;color:var(--muted)}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pill{font-size:12px;background:var(--surface2);color:var(--muted);border-radius:6px;padding:2px 7px;white-space:nowrap}
.pill b{color:var(--fg);font-variant-numeric:tabular-nums}.pill.on{background:var(--gold-soft);color:var(--gold-fg)}.pill.on b{color:var(--gold-fg)}
.pill.z b{color:var(--muted)}.pill.neg{background:var(--bad-soft);color:var(--bad)}.pill.neg b{color:var(--bad)}
.cst{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn.xs{padding:2px 9px;font-size:12.5px}
/* --- new move --- */
h3.step{display:flex;align-items:center;gap:8px}h3.step span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--vault);color:var(--vault-fg);font-size:13px}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,128px),1fr));gap:8px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;background:var(--surface2);border:1.5px solid transparent;border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--fg)}
.qa button svg{width:22px;height:22px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-bottom:2px}
.qa button b{font-size:14.5px;font-weight:600}.qa button small{font-size:12px;color:var(--muted)}
.qa button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.qa button[aria-pressed="true"] small{color:var(--gold-fg)}
.flow{font-size:13.5px;color:var(--gold-fg);background:var(--gold-soft);border-radius:8px;padding:8px 12px}
.picker{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.picker .grow{flex:1 1 240px}
.picker select{font-size:16px;padding:10px}.picker .add{padding:10px 22px;font-size:15px}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.stepper button{width:40px;border:0;background:var(--surface2);font:inherit;font-size:20px;color:var(--fg);cursor:pointer}
.stepper input{border:0;border-radius:0;width:64px;text-align:center;font-size:17px;font-weight:600}
.stepper.sm button{width:34px;font-size:18px}.stepper.sm input{width:52px;font-size:15px;padding:6px}
.cart{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ci{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}.ci:last-child{border-bottom:0}
.ci .cn{flex:1;min-width:0;display:flex;flex-direction:column}.ci .cn small{color:var(--muted);font-size:12.5px}
.ci.over{background:var(--bad-soft)}.ci.over .cn small{color:var(--bad)}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px;padding:4px 0}
details.more[open] summary{margin-bottom:10px}
.savebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--vault);color:var(--vault-fg);border-radius:12px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.savebar .muted{color:var(--vault-fg);opacity:.75}.savebar #f_tot{font-size:16px}.savebar #f_tot b{font-size:20px;color:#F3D779}
.savebar .btn{border-color:rgba(255,255,255,.25);background:transparent;color:var(--vault-fg)}.savebar .btn.gold{background:var(--gold);color:#1B1405;border-color:var(--gold);padding:10px 22px;font-size:15.5px}

/* --- login with Jeddah photo --- */
body.loginbg{background:#0F2C33}
body.loginbg main{min-height:100vh;min-height:100dvh;justify-content:center;max-width:1100px}
.loginwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:28px;align-items:center}
.loginphoto{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:495/619;max-height:86vh;justify-self:center;width:100%;max-width:560px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.loginphoto img{width:100%;height:100%;object-fit:cover;display:block}
.loginphoto span{position:absolute;inset:auto 0 0 0;padding:28px 18px 14px;color:#fff;font-size:14px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
body.loginbg .login{margin:0;box-shadow:0 18px 50px rgba(0,0,0,.35);border-color:transparent}
body.loginbg #toast{z-index:30}
@media (max-width:820px){
  body.loginbg::after{content:"";position:fixed;inset:0;z-index:-1;background:#0F2C33 url(login-bg.jpg) center top/cover no-repeat}
  body.loginbg main{justify-content:flex-end;padding-bottom:24px}
  .loginwrap{grid-template-columns:1fr}.loginphoto{display:none}
  body.loginbg .login{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
}

.vault-title{color:var(--gold);font-weight:700;font-size:15px;margin-top:2px}
label.chk{flex-direction:row;align-items:center;gap:6px;color:var(--fg);flex:0 0 auto;white-space:nowrap}
label.chk input{width:auto}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;flex-wrap:wrap}
.dayc{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:200px}
.dayc b{font-size:22px;color:var(--gold-fg)}
.dayc input{max-width:190px;text-align:center}
.danger-zone{border-color:var(--bad)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}

/* --- money, orders, summary --- */
.req{color:var(--bad)}
.paytot{font-size:16px;text-align:end}.paytot b{color:var(--gold);font-size:20px}
.paychips{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px}
.paychips span{background:var(--surface2);border-radius:6px;padding:2px 8px;color:var(--muted)}.paychips b{color:var(--fg)}
.paychips .pt{background:var(--gold-soft);color:var(--gold-fg)}.paychips .pt b{color:var(--gold-fg)}
.order{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.order .mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.order.done{padding:8px 12px}
.sumtbl{display:flex;flex-direction:column}
.sumtbl div{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.sumtbl b.pos{color:var(--ok)}.sumtbl b.neg{color:var(--bad)}
.sumtbl .end{border-bottom:0;border-top:2px solid var(--gold);margin-top:4px;font-size:17px}.sumtbl .end b{color:var(--gold)}
select.karat{width:auto;font-size:13px;padding:4px 6px}
.sw.res,.seg-bar.res{background:#8E7CC3}
tr.voidrow td{opacity:.5;text-decoration:line-through}

/* --- item picker, invoice, journal, users --- */
.ipick{display:flex;flex-direction:column;gap:10px;background:var(--surface2);border-radius:10px;padding:12px}
.ipick input#ip_q{font-size:16px}
.ip-g{display:flex;flex-direction:column;gap:6px}
.ip-gl{font-size:12.5px;color:var(--muted);font-weight:600}
.ip-items{display:flex;flex-wrap:wrap;gap:8px}
.ip-it{font:inherit;font-weight:700;font-size:15.5px;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.ip-it:hover{border-color:var(--gold)}
.ip-it.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-fg)}
.ip-it i{font-style:normal;background:var(--gold);color:#1B1405;border-radius:999px;font-size:12px;min-width:22px;padding:1px 7px;text-align:center}
b.iname{font-size:16px}
h4.sub{margin:6px 0 0;font-size:14.5px}
.logsum{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}.logsum b{color:var(--fg)}
.journal table{font-size:13.5px}.journal td{vertical-align:top;white-space:normal}
.journal td.wrap{min-width:220px;max-width:360px}
td.nowrap,.nowrap{white-space:nowrap}
.acts{display:flex;gap:4px;flex-wrap:wrap}.move .acts:empty{display:none}
.custlink{color:var(--gold-fg);font-weight:600}
.pager{justify-content:center}
.permgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px;background:var(--surface2);border-radius:10px;padding:12px}
.permgrid h4{margin:0 0 6px;font-size:14px}
.permgrid label.chk{display:flex;padding:3px 0;font-size:14px}
.useredit{display:flex;flex-direction:column;gap:10px;padding:8px 0}
</style>
</head>
