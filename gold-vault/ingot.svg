<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 112">
  <!-- Cast fine-gold ingot seen from the front-right and above: top, front, right and left faces, bevel lights, stamped marks -->
  <defs>
    <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8DA"/>
      <stop offset=".3" stop-color="#F9DD86"/>
      <stop offset=".75" stop-color="#E4B24B"/>
      <stop offset="1" stop-color="#C98F28"/>
    </linearGradient>
    <linearGradient id="gFront" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#F6CF66"/>
      <stop offset=".5" stop-color="#D49A30"/>
      <stop offset="1" stop-color="#8A570F"/>
    </linearGradient>
    <linearGradient id="gRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C98E29"/>
      <stop offset=".6" stop-color="#94600F"/>
      <stop offset="1" stop-color="#5C3806"/>
    </linearGradient>
    <linearGradient id="gLeft" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1C25A"/>
      <stop offset="1" stop-color="#A06C18"/>
    </linearGradient>
    <linearGradient id="gShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gShadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".5"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cTop"><path d="M40 16 L116 11 L132 31 L50 38 Z"/></clipPath>
    <clipPath id="cFront"><path d="M50 38 L132 31 L144 86 L20 95 Z"/></clipPath>
  </defs>

  <ellipse cx="88" cy="97" rx="80" ry="10" fill="url(#gShadow)"/>

  <path d="M40 16 L50 38 L20 95 L10 66 Z" fill="url(#gLeft)"/>
  <path d="M116 11 L132 31 L144 86 L160 60 Z" fill="url(#gRight)"/>
  <path d="M50 38 L132 31 L144 86 L20 95 Z" fill="url(#gFront)"/>
  <path d="M40 16 L116 11 L132 31 L50 38 Z" fill="url(#gTop)"/>

  <!-- bevel lights and dark edges -->
  <path d="M40 16 L116 11" stroke="#FFFCEB" stroke-width="1.5" stroke-linecap="round" opacity=".95"/>
  <path d="M50 38 L132 31" stroke="#FFF1B5" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M40 16 L50 38" stroke="#FFF1B5" stroke-width="1" opacity=".8"/>
  <path d="M132 31 L144 86" stroke="#FCE2A0" stroke-width="1" opacity=".6"/>
  <path d="M20 95 L144 86 L160 60" stroke="#4E2F05" stroke-width="1.4" fill="none" opacity=".7"/>

  <!-- stamped marks -->
  <g clip-path="url(#cTop)">
    <g transform="rotate(-4.3 88 25)">
      <rect x="62" y="17.5" width="50" height="16" rx="3" fill="none" stroke="#A3701B" stroke-width="1" opacity=".8"/>
      <text x="87" y="24.6" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="6.1" font-weight="700" fill="#87590F" letter-spacing=".6">FINE GOLD</text>
      <text x="87" y="31.4" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="6.3" font-weight="700" fill="#87590F">999.9</text>
    </g>
    <path d="M44 8 L74 6 L60 44 L30 46 Z" fill="url(#gShine)" opacity=".6"/>
  </g>
  <g clip-path="url(#cFront)">
    <path d="M58 30 L86 28 L64 100 L36 102 Z" fill="url(#gShine)" opacity=".5"/>
    <path d="M104 28 L112 28 L104 100 L96 100 Z" fill="#fff" opacity=".13"/>
    <path d="M50 38 L132 31 L133 36 L52 43 Z" fill="#fff" opacity=".18"/>
  </g>
</svg>
