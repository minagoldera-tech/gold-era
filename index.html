<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c0b09">
  <title>GOLD ERA ERP</title>
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div id="app"><div class="loading"><img alt="GOLD ERA" src="assets/logo.jpg"></div></div>
  <noscript>هذا النظام يحتاج تفعيل JavaScript في المتصفح.</noscript>

  <script src="config.js"></script>
  <script>
    /* Firebase is loaded only when config.js has a Firebase config; otherwise the app runs in local mode. */
    (function () {
      var c = window.GOLD_ERA_CONFIG || {};
      if (c.firebase && c.firebase.apiKey) {
        var v = "10.12.2", base = "https://www.gstatic.com/firebasejs/" + v + "/";
        document.write('<script src="' + base + 'firebase-app-compat.js"><\/script>' +
                       '<script src="' + base + 'firebase-auth-compat.js"><\/script>' +
                       '<script src="' + base + 'firebase-firestore-compat.js"><\/script>');
      }
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="src/platform.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
