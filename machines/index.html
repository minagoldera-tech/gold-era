<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>ماكينات GOLD ERA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: black brand bar, tab strip, then a square-gridded work area (GOLD ERA FACTORY design system). */
:root{
  --logo-gold:#ddb546; --logo-black:#000; --on-brand:#fff;
  --gold-500:#ffc000; --gold-400:#f1c232; --gold-300:#f7cb4d; --gold-050:#fef8e3;
  --green-500:#8bc34a; --green-400:#92d050; --green-050:#eef7e3; --on-fill:#000;
  --danger:#ff0000; --danger-strong:#c00000; --danger-050:#fdecea; --warn-050:#fff4d6;
  --ink:#000; --slate:#44546a; --surface:#fff; --surface-raised:#fff; --surface-sunk:#f7f6f3; --gray-100:#e7e6e6; --gray-200:#cfcdc8; --link:#0563c1;
  --font:"IBM Plex Sans Arabic", Calibri, Tahoma, system-ui, sans-serif;
  --r-sm:2px; --r-md:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --gold-050:#221c0c; --green-050:#16200f; --danger:#ff5544; --danger-strong:#ff7a6e; --danger-050:#2b1412; --warn-050:#2a2209;
  --ink:#f5efe0; --slate:#a9b1bd; --surface:#121110; --surface-raised:#1d1b18; --surface-sunk:#181614; --gray-100:#3a3732; --gray-200:#4a463f; --link:#79b0ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --gold-050:#221c0c; --green-050:#16200f; --danger:#ff5544; --danger-strong:#ff7a6e; --danger-050:#2b1412; --warn-050:#2a2209;
  --ink:#f5efe0; --slate:#a9b1bd; --surface:#121110; --surface-raised:#1d1b18; --surface-sunk:#181614; --gray-100:#3a3732; --gray-200:#4a463f; --link:#79b0ff; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--surface);color:var(--ink)}
body{font-family:var(--font);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--logo-black)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1480px;margin:0 auto}

/* brand bar */
.brand{background:var(--logo-black);color:var(--on-brand);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.brand .wrap{display:flex;align-items:center;gap:16px;min-height:64px;padding-block:6px}
.brand img{height:44px;width:auto;display:block}
.brand h1{margin:0;font-size:18px;font-weight:700;color:var(--logo-gold);line-height:1.2}
.brand p{margin:0;font-size:12px;color:#d9d4c7}
.brand .sp{flex:1}
.who{font-size:12px;color:#d9d4c7;text-align:left}
.tabs{display:flex;gap:2px;overflow-x:auto;background:var(--logo-black);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:#1d1b18;color:#e9e4d6;padding:10px 18px;font-weight:600;cursor:pointer;white-space:nowrap;border-top:3px solid transparent}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);border-top-color:var(--gold-500)}
.tab:hover{color:#fff}
.tab[aria-selected="true"]:hover{color:var(--ink)}

main{padding-block:24px 64px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.bar h2{margin:0;font-size:24px;font-weight:700;text-wrap:balance}
.bar .sp{flex:1}
.hint{color:var(--slate);font-size:13px}

/* controls */
.btn{border:1px solid var(--ink);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;text-decoration:none;font-size:14px}
.btn:hover{background:var(--gold-050)}
.btn.primary{background:var(--gold-500);color:var(--on-fill);border-color:var(--gold-500)}
.btn.primary:hover{background:var(--gold-400)}
.btn.save{background:#70ad47;border-color:#70ad47;color:#000;box-shadow:0 2.93px 4.67px rgba(0,0,0,.32)}
.btn.ghost{border-color:var(--gray-200)}
.btn.danger{border-color:var(--danger-strong);color:var(--danger-strong)}
.btn.sm{padding:3px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:700;color:var(--slate)}
.in{border:1px solid var(--slate);background:var(--surface);border-radius:var(--r-sm);padding:7px 10px;min-width:0;width:100%}
textarea.in{min-height:84px;resize:vertical}
.search{max-width:280px}
select.in{padding-inline:8px 28px}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));border:1px solid var(--gray-200);margin-bottom:24px}
.kpi{padding:14px 16px;border-inline-start:1px solid var(--gray-200);background:var(--surface-raised)}
.kpi:first-child{border-inline-start:0}
.kpi b{display:block;font-size:30px;line-height:1.1;font-weight:700}
.kpi span{font-size:13px;color:var(--slate)}
.kpi.alert b{color:var(--danger-strong)}
.meter{height:6px;background:var(--gray-100);margin-top:8px}
.meter i{display:block;height:100%;background:var(--green-500)}

.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.panel{border:1px solid var(--gray-200);background:var(--surface-raised)}
.panel>h3{margin:0;padding:10px 14px;background:var(--gold-500);color:var(--on-fill);font-size:16px;display:flex;align-items:center;gap:8px}
.panel>h3 small{font-weight:500;font-size:12px}
.panel .body{padding:12px 14px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--gray-200);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--gold-500);color:var(--on-fill);font-weight:700;padding:10px 8px;text-align:right;white-space:nowrap;border:1px solid #d9a300;position:sticky;top:0}
td{padding:8px;border:1px solid var(--gray-100);vertical-align:top}
tbody tr:nth-child(even) td{background:var(--gold-050)}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover td{background:var(--warn-050)}
td.c,th.c{text-align:center}
td ul{margin:0;padding-inline-start:18px}
td ul li{margin:0}
.code{font-weight:700;white-space:nowrap;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.en{color:var(--slate);font-size:12px;direction:ltr;unicode-bidi:isolate;display:block;text-align:right}
.mcell{border:0;background:transparent;width:30px;height:26px;cursor:default;font-weight:700;border-radius:var(--r-sm)}
.mcell.edit{cursor:pointer}
.mcell.edit:hover{outline:1px solid var(--slate)}
.m-P{background:var(--surface-sunk);color:var(--slate);border:1px dashed var(--slate)!important}
.m-D{background:var(--green-400);color:#000}
.m-X{background:var(--danger-strong);color:#fff}
.mon-now{box-shadow:inset 0 -3px 0 var(--ink)}

.badge{display:inline-block;padding:1px 8px;border-radius:var(--r-sm);font-size:12px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.b-low{background:var(--green-400);color:#000}
.b-med{background:var(--gold-300);color:#000}
.b-high{background:var(--danger-strong);color:#fff}
.b-crit{background:#000;color:#ff7a6e;border-color:#ff7a6e}
.b-ok{background:var(--green-400);color:#000}
.b-off{background:var(--gold-300);color:#000}
.b-rej{background:var(--danger-strong);color:#fff}
.b-n{background:var(--surface-sunk);color:var(--ink);border-color:var(--gray-200)}

/* machine cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{border:1px solid var(--gray-200);background:var(--surface-raised);display:grid;grid-template-columns:84px minmax(0,1fr);text-align:right;cursor:pointer;padding:0;color:var(--ink)}
.card:hover{border-color:var(--ink)}
.card .ph{background:#fff;display:flex;align-items:center;justify-content:center;border-inline-end:1px solid var(--gray-100);min-height:104px}
.card .ph img{max-width:76px;max-height:96px;object-fit:contain}
.card .tx{padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .top{display:flex;justify-content:space-between;gap:6px;align-items:center}
.card .nm{font-weight:700;font-size:15px;line-height:1.35}
.card .br{font-size:12px;color:var(--slate)}
.noimg{color:var(--slate);font-size:11px;text-align:center;padding:6px}
.group-h{margin:20px 0 8px;font-size:15px;font-weight:700;display:flex;gap:8px;align-items:center}
.group-h::after{content:"";flex:1;height:1px;background:var(--gray-200)}

/* drawer / modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;justify-content:flex-start}
.drawer{background:var(--surface);width:min(980px,100%);height:100%;overflow-y:auto;box-shadow:0 0 24px rgba(0,0,0,.3);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{background:var(--logo-black);color:var(--on-brand);padding:14px max(16px,env(safe-area-inset-left,0px)) 14px max(16px,env(safe-area-inset-right,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;position:sticky;top:0;z-index:2}
.dh .ph{width:72px;height:88px;background:#fff;display:flex;align-items:center;justify-content:center}
.dh .ph img{max-width:68px;max-height:84px;object-fit:contain}
.dh h2{margin:0;font-size:20px;color:var(--logo-gold);line-height:1.3}
.dh .en{color:#cfc8b6}
.dh .code{color:#fff}
.x{border:1px solid #777;background:transparent;color:#fff;width:36px;height:36px;cursor:pointer;font-size:20px;line-height:1}
.dtabs{display:flex;gap:0;overflow-x:auto;border-bottom:2px solid var(--gold-500);background:var(--surface-sunk)}
.dtab{border:0;background:transparent;padding:10px 16px;cursor:pointer;font-weight:600;white-space:nowrap;color:var(--slate)}
.dtab[aria-selected="true"]{background:var(--gold-500);color:#000}
.dbody{padding:18px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));border:1px solid var(--gray-200)}
.kv div{display:grid;grid-template-columns:130px minmax(0,1fr);border-bottom:1px solid var(--gray-100)}
.kv dt{background:var(--gold-050);padding:8px 10px;font-weight:700;font-size:13px;color:var(--slate)}
.kv dd{margin:0;padding:8px 10px;min-width:0;overflow-wrap:anywhere}
.empty-v{color:var(--slate)}
.desc{margin:0 0 16px;font-size:15px;max-width:72ch}
.files{display:flex;flex-direction:column;border:1px solid var(--gray-200)}
.file{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--gray-100)}
.file:last-child{border-bottom:0}
.ficon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--gold-500);color:#000}
.ficon.link{background:var(--surface-sunk);color:var(--ink);border:1px solid var(--gray-200)}
.fname{font-weight:600;overflow-wrap:anywhere}
.fmeta{font-size:12px;color:var(--slate);overflow-wrap:anywhere}
.drop{border:2px dashed var(--gray-200);padding:18px;text-align:center;color:var(--slate);margin-top:12px}
.drop.on{border-color:var(--gold-500);background:var(--gold-050)}
.ohs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.ohs-grid .panel>h3{background:var(--surface-sunk);color:var(--ink);border-bottom:2px solid var(--gold-500)}
.risk{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:12px 14px;border:1px solid var(--gray-200)}
.risk b{font-size:26px}

.modal{background:var(--surface);width:min(720px,100%);max-height:100%;overflow:auto;margin:auto;border-top:6px solid var(--gold-500)}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.modal h3{margin:0;padding:14px 18px;font-size:18px;border-bottom:1px solid var(--gray-100)}
.modal form{padding:16px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.modal .full{grid-column:1/-1}
.modal .acts{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-start;padding-top:6px}
@media (max-width:560px){.modal form{grid-template-columns:1fr}}
.confirm p{padding:16px 18px;margin:0}
.confirm .acts{display:flex;gap:10px;padding:0 18px 18px}

.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));background:var(--logo-black);color:#fff;padding:10px 16px;z-index:60;border-inline-start:4px solid var(--gold-500);max-width:min(420px,calc(100% - 32px))}
.notice{padding:14px 16px;border:1px solid var(--gray-200);background:var(--gold-050);margin-bottom:16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--slate);align-items:center}
.legend .mcell{width:24px;height:20px;display:inline-flex;align-items:center;justify-content:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--gray-200);background:var(--surface);padding:4px 12px;cursor:pointer;border-radius:var(--r-sm);font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.skel{padding:40px 0;color:var(--slate)}
@media (max-width:600px){.brand p,.who{display:none}.brand h1{font-size:15px}.kv div{grid-template-columns:110px minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(-24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

function pmStats(list, onlyMonth){
  let planned=0, done=0, missed=0;
  for (const t of list) for (let m=0;m<12;m++){ if (onlyMonth!==undefined && m!==onlyMonth) continue; const v=cellVal(t,m); if(v) planned++; if(v==="D") done++; if(v==="X") missed++; }
  return {planned, done, missed, pct: planned ? Math.round(done*100/planned) : 0};
}
const NEXT = {"":"P","P":"D","D":"X","X":""};
async function cycleCell(id, m){
  if(!S.canEdit) return;
  const t=S.pm.find(x=>x.id===id); if(!t) return;
  const nv=NEXT[cellVal(t,m)];
  t.y = t.y || {}; t.y[S.year] = Object.assign({}, t.y[S.year], {[m]:nv});
  render();
  try{ await S.db.doc("pm/"+id).update({y:{[S.year]:{[m]:nv}}}); }catch(e){ fail(e,"حفظ الحالة"); }
}

/* ---------- rendering ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===S.tab)));
  const main=$("#main");
  if(!S.db){ main.innerHTML = `<div class="notice">تعذّر تحميل ملف البيانات data/data.json. تأكد أن الملف موجود في المستودع ثم أعد تحميل الصفحة.</div>`; return; }
  if(!S.loaded.m){ main.innerHTML = `<div class="skel">جارِ تحميل بيانات الماكينات…</div>`; return; }
  if(S.machines.size===0){ main.innerHTML = `<div class="notice">لا توجد ماكينات مسجلة بعد. ${S.canEdit?'أضف أول ماكينة من زر «إضافة ماكينة».':''}</div>${S.canEdit?'<button class="btn primary" data-act="add-machine">+ إضافة ماكينة</button>':''}`; return; }
  main.innerHTML = ({dash:viewDash, machines:viewMachines, pm:viewPM, ohs:viewOHS, logs:viewLogs}[S.tab])();
  if(S.open) renderDrawer();
}

  return `
  <div class="bar"><h2>لوحة المتابعة</h2><span class="hint">شهر ${MONTHS[mon]} <span class="num">${S.year}</span></span><div class="sp"></div>
   <button class="btn ghost" data-act="export-all">تحميل كل البيانات (Excel)</button></div>
  <div class="kpis">
    <div class="kpi"><b class="num">${ms.length}</b><span>ماكينة مسجلة · ${Object.entries(byDept).map(([d,n])=>`${esc(d)} <span class="num">${n}</span>`).join(" · ")}</span></div>
    <div class="kpi"><b class="num">${mo.done}/${mo.planned}</b><span>مهام صيانة ${MONTHS[mon]} المنفذة</span><div class="meter"><i style="width:${mo.pct}%"></i></div></div>
    <div class="kpi"><b class="num">${yr.pct}%</b><span>نسبة تنفيذ خطة <span class="num">${S.year}</span> (${yr.done} من ${yr.planned})</span><div class="meter"><i style="width:${yr.pct}%"></i></div></div>
    <div class="kpi ${risky.length?'alert':''}"><b class="num">${risky.length}</b><span>ماكينة بمستوى خطورة عالٍ أو حرج</span></div>
    <div class="kpi ${out.length?'alert':''}"><b class="num">${out.length}</b><span>ماكينة خارج الخدمة · <span class="num">${cal}</span> تحتاج معايرة</span></div>
  </div>
  <div class="cols">
    <section class="panel"><h3>صيانة ${MONTHS[mon]} <small>(${due.length} مهمة) — اضغط الخانة لتغيير الحالة</small></h3>
      <div class="tw" style="border:0"><table><thead><tr><th>الكود</th><th>الماكينة</th><th>النشاط</th><th>الدورية</th><th class="c">الحالة</th></tr></thead><tbody>
      ${due.map(t=>`<tr><td class="code">${esc(t.code)}</td><td>${esc(mName(t.code))}</td><td>${esc(t.activity)}</td><td>${esc(t.freq)}</td><td class="c">${cellBtn(t,mon)}</td></tr>`).join("") || `<tr><td colspan="5" class="hint">لا توجد مهام مخططة هذا الشهر.</td></tr>`}
      </tbody></table></div></section>
    <div style="display:flex;flex-direction:column;gap:24px;min-width:0">
      <section class="panel"><h3>ماكينات تحتاج انتباه السلامة</h3><div class="body">
        ${risky.sort((a,b)=>b.likelihood*b.severity-a.likelihood*a.severity).map(o=>`<div style="display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--gray-100);cursor:pointer" data-open="${esc(o.code)}" data-dtab="ohs"><span class="badge ${lvlClass(o.level)}">${esc(o.level)}</span><span class="code">${esc(o.code)}</span><span style="min-width:0">${esc(mName(o.code))}</span></div>`).join("") || '<span class="hint">لا توجد.</span>'}
      </div></section>
      <section class="panel"><h3>آخر أعمال الصيانة</h3><div class="body">
        ${recent.map(l=>`<div style="padding:6px 0;border-bottom:1px solid var(--gray-100)"><span class="num">${esc(l.date)}</span> · <span class="code">${esc(l.code)}</span> · ${esc(l.type)}<div class="hint">${esc(l.desc)}</div></div>`).join("") || `<span class="hint">لم يُسجل أي عمل بعد. سجّل الأعمال من تبويب «سجل أعمال الصيانة».</span>`}
      </div></section>
    </div>
  </div>`;
}

function cellBtn(t,m){
  const v=cellVal(t,m); const lab={P:"مخطط",D:"تم",X:"لم يُنفذ","":"غير مخطط"}[v];
  return `<button class="mcell ${v?'m-'+v:''} ${S.canEdit?'edit':''}" data-cell="${esc(t.id)}" data-m="${m}" title="${MONTHS[m]}: ${lab}" aria-label="${MONTHS[m]}: ${lab}">${v==="D"?"✓":v==="X"?"✗":v==="P"?"P":""}</button>`;
}

function viewMachines(){
  const q=S.mq.trim().toLowerCase();
  const ms=machinesSorted().filter(m=>(!S.mdept||m.dept===S.mdept) && (!q || [m.code,m.nameAr,m.nameEn,m.brand,m.model,m.category].join(" ").toLowerCase().includes(q)));
  const groups={}; ms.forEach(m=>{(groups[m.dept]=groups[m.dept]||[]).push(m)});
  return `
  <div class="bar"><h2>كتالوج الماكينات</h2><span class="hint"><span class="num">${ms.length}</span> ماكينة</span><div class="sp"></div>
    <input class="in search" id="mq" type="search" placeholder="ابحث بالكود أو الاسم أو الماركة" value="${esc(S.mq)}" aria-label="بحث">
    <select class="in" id="mdept" style="width:auto" aria-label="القسم"><option value="">كل الأقسام</option>${DEPTS.map(d=>`<option ${S.mdept===d?'selected':''}>${d}</option>`).join("")}</select>
    <button class="btn ghost" data-act="export-machines">تحميل الكتالوج (Excel)</button>
    ${S.canEdit?'<button class="btn primary" data-act="add-machine">+ إضافة ماكينة</button>':''}
  </div>
  ${Object.keys(groups).sort((a,b)=>DEPTS.indexOf(a)-DEPTS.indexOf(b)).map(d=>`
    <div class="group-h">${esc(d)} <span class="hint num">${groups[d].length}</span></div>
    <div class="grid">${groups[d].map(card).join("")}</div>`).join("") || '<p class="hint">لا توجد نتائج مطابقة للبحث.</p>'}`;
}
function card(m){
  const nf=(m.files||[]).length + catalogsOf(m).length;
  return `<button class="card" data-open="${esc(m.code)}">
    <div class="ph">${m.photo?`<img src="${esc(m.photo)}" alt="">`:'<span class="noimg">لا توجد صورة</span>'}</div>
    <div class="tx"><div class="top"><span class="code">${esc(m.code)}</span>${m.status&&m.status!=="في الخدمة"?`<span class="badge ${stClass(m.status)}">${esc(m.status)}</span>`:''}</div>
      <span class="nm">${esc(m.nameAr)}</span><span class="en">${esc(m.nameEn)}</span>
      <span class="br">${esc([m.brand,m.model].filter(Boolean).join(" – ")||"الماركة غير معروفة")}${nf?` · ${nf} ملف`:''}</span></div></button>`;
}

  return `

  </tbody></table></div>`;
}

  <div class="tw"><table><thead><tr><th>الكود</th><th>الماكينة</th><th>المخاطر</th><th class="c">الاحتمالية</th><th class="c">الشدة</th><th class="c">الدرجة</th><th>المستوى</th><th>إجراءات التحكم</th><th>مهمات الوقاية (PPE)</th><th>الطوارئ</th><th>الفحص</th>${S.canEdit?'<th></th>':''}</tr></thead><tbody>
  ${rows.map(([m,o])=>o?`<tr class="clk" data-open="${esc(m.code)}" data-dtab="ohs">
    <td class="code">${esc(m.code)}</td><td style="min-width:140px">${esc(m.nameAr)}</td>
    <td style="min-width:220px"><ul>${arr(o.hazards).map(h=>`<li>${esc(h)}</li>`).join("")}</ul></td>
    <td class="c num">${o.likelihood}</td><td class="c num">${o.severity}</td><td class="c num"><b>${o.likelihood*o.severity}</b></td>
    <td><span class="badge ${lvlClass(o.level)}">${esc(o.level)}</span></td>
    <td style="min-width:260px"><ul>${arr(o.controls).map(h=>`<li>${esc(h)}</li>`).join("")}</ul></td>

    :`<tr><td class="code">${esc(m.code)}</td><td>${esc(m.nameAr)}</td><td colspan="9" class="hint">لم يُقيَّم بعد.</td>${S.canEdit?`<td><button class="btn sm primary" data-edit-ohs="${esc(m.code)}">تقييم</button></td>`:''}</tr>`).join("")}
  </tbody></table></div>`;
}

function logRows(list){
  return list.map(l=>`<tr><td class="num">${esc(l.date)}</td><td class="code">${esc(l.code)}</td><td>${esc(mName(l.code))}</td><td>${esc(l.type)}</td><td style="min-width:240px">${esc(l.desc)}</td><td>${esc(l.parts)}</td><td class="c num">${esc(l.downtime)}</td><td class="c num">${esc(l.cost)}</td><td>${esc(l.by)}</td><td>${l.result?`<span class="badge ${l.result==='تم الإصلاح'?'b-ok':l.result==='قيد التنفيذ'?'b-off':'b-n'}">${esc(l.result)}</span>`:''}</td>${S.canEdit?`<td><button class="btn sm ghost" data-edit-log="${esc(l.id)}">تعديل</button></td>`:''}</tr>`).join("");
}

  const q=S.logQ.trim().toLowerCase();
  const list=[...S.logs].filter(l=>!q||[l.code,mName(l.code),l.type,l.desc,l.by].join(" ").toLowerCase().includes(q)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  return `
  <div class="bar"><h2>سجل أعمال الصيانة</h2><span class="hint"><span class="num">${list.length}</span> سجل</span><div class="sp"></div>

}

/* ---------- machine drawer ---------- */
function openMachine(code, dtab){ S.open=code; S.dtab=dtab||"info"; renderDrawer(); }
function closeDrawer(){ S.open=null; $("#layer").innerHTML=""; }
function renderDrawer(){
  const m=S.machines.get(S.open); if(!m){ closeDrawer(); return; }
  const tabs=[["info","البيانات"],["cat","الكتالوج والملفات"],["pm","الصيانة الدورية"],["ohs","السلامة"],["log","سجل الصيانة"]];
  const scroll=$(".drawer")?.scrollTop||0;
  $("#layer").innerHTML=`<div class="scrim" data-scrim="1"><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(m.nameAr)}">
    <div class="dh"><div class="ph">${m.photo?`<img src="${esc(m.photo)}" alt="">`:'<span class="noimg">لا صورة</span>'}</div>
      <div style="min-width:0"><span class="code">${esc(m.code)}</span> ${m.status?`<span class="badge ${stClass(m.status)}">${esc(m.status)}</span>`:''}<h2>${esc(m.nameAr)}</h2><span class="en">${esc(m.nameEn)}</span></div>
      <button class="x" data-act="close" aria-label="إغلاق">×</button></div>
    <div class="dtabs" role="tablist">${tabs.map(([k,l])=>`<button class="dtab" role="tab" data-dtab-sel="${k}" aria-selected="${S.dtab===k}">${l}</button>`).join("")}</div>
    <div class="dbody">${({info:dInfo,cat:dCat,pm:dPM,ohs:dOHS,log:dLog}[S.dtab])(m)}</div></aside></div>`;
  const d=$(".drawer"); if(d) d.scrollTop=scroll;
}
function dInfo(m){
  const rows=[["الكود",`<span class="code">${esc(m.code)}</span>`],["القسم",val(m.dept)],["الفئة",val(m.category)],["الموقع",val(m.location)],["الشركة المصنعة",val(m.brand)],["بلد المنشأ",val(m.origin)],["الموديل",val(m.model)],["الرقم التسلسلي",val(m.serial)],["سنة الصنع",val(m.year)],["المورد",val(m.supplier)],["تاريخ الاستلام",val(m.receivedAt)],["تاريخ التشغيل",val(m.inServiceAt)],["تحتاج معايرة",m.calRequired?"نعم":"لا"],["الحالة",m.status?`<span class="badge ${stClass(m.status)}">${esc(m.status)}</span>`:val("")],["ملاحظات",val(m.notes)]];
  return `<p class="desc">${esc(m.descAr)}<span class="en" style="font-size:13px">${esc(m.descEn)}</span></p>
    <dl class="kv">${rows.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
    <h3 style="margin:22px 0 8px;font-size:16px">المواصفات الفنية</h3>
    ${(m.specs||[]).length?`<div class="tw"><table><thead><tr><th>البند</th><th>القيمة</th><th>المصدر</th></tr></thead><tbody>${m.specs.map(x=>`<tr><td style="font-weight:700;white-space:nowrap">${esc(x.k)}</td><td>${esc(x.v)}</td><td style="font-size:12px">${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.src)}</a>`:esc(x.src||"")}</td></tr>`).join("")}</tbody></table></div>`:'<p class="hint">لم تُسجل مواصفات فنية بعد.</p>'}
    <h3 style="margin:22px 0 8px;font-size:16px">مصادر البيانات</h3>
    <ol style="margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:4px">${sourcesOf(m).map(x=>`<li>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>`:esc(x.title)}${x.note?` <span class="hint">— ${esc(x.note)}</span>`:''}</li>`).join("")}</ol>
    ${S.canEdit?`<div class="bar" style="margin-top:16px"><button class="btn primary" data-act="edit-machine">تعديل البيانات</button><label class="btn ghost" for="photoIn">تغيير الصورة</label><input id="photoIn" type="file" accept="image/*" hidden><div class="sp"></div><button class="btn danger" data-act="del-machine">حذف الماكينة</button></div>`:''}`;
}
function sourcesOf(m){ const out=[...(m.sources||[])]; const seen=new Set(out.map(x=>x.url)); for(const c of catalogsOf(m)) if(!seen.has(c.url)){ seen.add(c.url); out.push({title:c.title,url:c.url,note:"كتالوج / مرجع"}); } return out; }
const specsToText=sp=>(sp||[]).map(x=>[x.k,x.v,x.src||"",x.url||""].join(" | ")).join("\n");
const textToSpecs=t=>arr(t).map(l=>{ const [k,v,src,url]=l.split("|").map(x=>(x||"").trim()); return {k,v:v||"",src:src||"",url:url||""}; }).filter(x=>x.k);
function catalogsOf(m){ if(Array.isArray(m.catalogs)) return m.catalogs; const l=[]; if(m.pdfUrl) l.push({kind:"PDF",title:"كتالوج المصنع (PDF)",url:m.pdfUrl}); if(m.pageUrl) l.push({kind:"WEB",title:"صفحة الماكينة على موقع المصنع",url:m.pageUrl}); return l; }
function linkForm(m){ formModal("إضافة رابط كتالوج – "+m.code,[{k:"title",l:"اسم الكتالوج",req:true,full:true},{k:"url",l:"الرابط",t:"url",req:true,full:true,h:"يبدأ بـ https://"},{k:"kind",l:"النوع",t:"select",o:["PDF","دليل","WEB","فيديو"],v:"PDF"}],
  async d=>{ if(!/^https?:\/\//i.test(d.url)){ $("#ferr").textContent="الرابط لازم يبدأ بـ https://"; return false; } await S.db.doc("machines/"+m.code).update({catalogs:[...catalogsOf(m),d]}); toast("تمت إضافة الكتالوج"); }); }
function fmtSize(b){ if(!b) return ""; return b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB"; }

  <div class="files">${files.map((f,i)=>`<div class="file"><div class="ficon">${esc((f.name.split(".").pop()||"").slice(0,4).toUpperCase())}</div><div style="min-width:0"><div class="fname">${esc(f.name)}</div><div class="fmeta">${esc(f.kind||"")} · <span class="num">${fmtSize(f.size)}</span> · <span class="num">${esc((f.at||"").slice(0,10))}</span></div></div><div style="display:flex;gap:6px"><a class="btn sm" href="${esc(f.url)}" target="_blank" rel="noopener">فتح</a>${S.canEdit?`<button class="btn sm danger" data-del-file="${i}">حذف</button>`:''}</div></div>`).join("") || '<div class="file"><div class="ficon link">—</div><div class="hint">لم يُرفع أي ملف بعد (كتالوج، دليل تشغيل، شهادة معايرة، صور، فاتورة شراء).</div><span></span></div>'}</div>
  ${S.canEdit?(S.assets?`<div class="drop" id="drop"><div class="field" style="max-width:260px;margin:0 auto 10px"><label for="fkind">نوع الملف</label><select class="in" id="fkind">${["كتالوج","دليل تشغيل وصيانة","شهادة معايرة","صورة","فاتورة / مستند شراء","تقرير صيانة","أخرى"].map(k=>`<option>${k}</option>`).join("")}</select></div>اسحب الملفات هنا أو <label class="btn sm primary" for="fileIn">اختر ملفات</label><input id="fileIn" type="file" multiple hidden><div class="hint" style="margin-top:6px">PDF، صور، Excel/CSV، نصوص — حتى 20 ميجابايت للملف.</div></div>`:'<p class="hint">رفع الملفات غير متاح في هذا العرض.</p>'):''}`;
}
function dPM(m){

function dOHS(m){

function dLog(m){

/* ---------- forms ---------- */
function formModal(title, fields, onSave, extra){
  $("#layer").insertAdjacentHTML("beforeend", `<div class="scrim center" data-modal="1"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><form id="mform" novalidate>
  ${fields.map(f=>{ const id="f_"+f.k; const v=f.v??""; let ctl;
    if(f.t==="select") ctl=`<select class="in" id="${id}">${f.o.map(o=>`<option ${String(o)===String(v)?'selected':''}>${esc(o)}</option>`).join("")}</select>`;
    else if(f.t==="area"||f.t==="list") ctl=`<textarea class="in" id="${id}" ${f.t==="list"?'placeholder="بند في كل سطر"':''}>${esc(f.t==="list"?arr(v).join("\n"):v)}</textarea>`;
    else if(f.t==="check") ctl=`<label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="${id}" ${v?'checked':''}> ${esc(f.cl||"")}</label>`;
    else if(f.t==="months") ctl=`<div class="chips">${MONTHS.map((mm,i)=>`<label class="chip"><input type="checkbox" name="${id}" value="${i}" ${(v||[]).includes(i)?'checked':''}> ${mm}</label>`).join("")}</div>`;
    else ctl=`<input class="in" id="${id}" type="${f.t||'text'}" value="${esc(v)}" ${f.ro?'readonly':''} ${f.req?'required':''}>`;
    return `<div class="field ${f.full||f.t==="area"||f.t==="list"||f.t==="months"?'full':''}"><label for="${id}">${esc(f.l)}${f.req?' *':''}</label>${ctl}${f.h?`<span class="hint">${esc(f.h)}</span>`:''}</div>`; }).join("")}
  <div class="acts"><button class="btn save" type="submit">حفظ</button><button class="btn ghost" type="button" data-act="close-modal">إلغاء</button>${extra||""}<span class="hint" id="ferr" role="alert"></span></div></form></div></div>`);
  const form=$("#mform"); form.querySelector("input,select,textarea")?.focus();
  form.addEventListener("submit", async ev=>{ ev.preventDefault();
    const out={}; for(const f of fields){ const id="f_"+f.k;
      if(f.t==="check") out[f.k]=$("#"+id).checked;
      else if(f.t==="list") out[f.k]=arr($("#"+id).value);
      else if(f.t==="months") out[f.k]=[...form.querySelectorAll(`input[name="${id}"]:checked`)].map(x=>+x.value);
      else if(f.t==="number") out[f.k]=$("#"+id).value===""?"":Number($("#"+id).value);
      else out[f.k]=$("#"+id).value.trim();
      if(f.req && (out[f.k]===""||out[f.k]===undefined)){ $("#ferr").textContent=`اكتب ${f.l} قبل الحفظ.`; $("#"+id)?.focus(); return; } }
    const btn=form.querySelector("button[type=submit]"); btn.disabled=true;
    try{ const ok = await onSave(out); if(ok!==false){ closeModal(); } }catch(e){ fail(e,"الحفظ"); } finally{ btn.disabled=false; } });
}
function closeModal(){ document.querySelectorAll("[data-modal]").forEach(x=>x.remove()); }
function confirmBox(msg, label, fn){
  $("#layer").insertAdjacentHTML("beforeend", `<div class="scrim center" data-modal="1"><div class="modal confirm" role="alertdialog" aria-modal="true"><h3>تأكيد</h3><p>${esc(msg)}</p><div class="acts"><button class="btn danger" id="cfy">${esc(label)}</button><button class="btn ghost" data-act="close-modal">إلغاء</button></div></div></div>`);
  $("#cfy").focus(); $("#cfy").onclick=async()=>{ closeModal(); try{ await fn(); }catch(e){ fail(e,"الحذف"); } };
}
function nextCode(dept){ const p="GE-"+(PREFIX[dept]||"OTH")+"-"; let n=0; S.machines.forEach((m,c)=>{ if(c.startsWith(p)) n=Math.max(n,parseInt(c.slice(p.length))||0); }); return p+String(n+1).padStart(3,"0"); }

function addMachine(){
  formModal("إضافة ماكينة جديدة", machineFields({}, true), async d=>{
    d.code=d.code.toUpperCase().replace(/\s+/g,"-");
    if(!/^[A-Z0-9][A-Z0-9_.-]{0,40}$/.test(d.code)){ $("#ferr").textContent="الكود يُكتب بحروف إنجليزية وأرقام وشرطة فقط، مثل GE-PRD-026."; return false; }
    if(S.machines.has(d.code)){ $("#ferr").textContent="هذا الكود مستخدم لماكينة أخرى."; return false; }
    d.specs=textToSpecs(d.specsText); delete d.specsText;
    await S.db.doc("machines/"+d.code).set({...d, photo:"", files:[], catalogs:[], sources:[]}); toast("تمت إضافة الماكينة "+d.code); openMachine(d.code); });
  const dsel=$("#f_dept"); dsel.addEventListener("change",()=>{ $("#f_code").value=nextCode(dsel.value); });
}
function editMachine(m){ formModal("تعديل بيانات "+m.code, machineFields(m,false), async d=>{ delete d.code; d.specs=textToSpecs(d.specsText); delete d.specsText; await S.db.doc("machines/"+m.code).update(d); toast("تم حفظ التعديلات"); }); }

/* ---------- uploads ---------- */
async function uploadFiles(files){
  const m=S.machines.get(S.open); if(!m||!S.assets) return;
  const kind=$("#fkind")?.value||"أخرى"; const added=[];
  for(const f of files){ toast(`جارِ رفع ${f.name}…`);
    try{ const r=await S.assets.upload(f); added.push({id:r.id,url:r.url,name:f.name,size:r.sizeBytes,type:r.contentType,kind,at:new Date().toISOString()}); }
    catch(e){ console.error(e); toast(e.code==="too_large"?`الملف ${f.name} أكبر من 20 ميجابايت.`:e.code==="unsupported_type"?`نوع الملف ${f.name} غير مدعوم. ارفع PDF أو صورة أو Excel/CSV أو نص.`:`تعذّر رفع ${f.name}.`); } }
  if(!added.length) return;
  const cur=S.machines.get(m.code).files||[];
  try{ await S.db.doc("machines/"+m.code).update({files:[...cur,...added]}); toast(`تم رفع ${added.length} ملف`);}catch(e){ fail(e,"حفظ الملفات"); }
}
async function uploadPhoto(file){
  const m=S.machines.get(S.open); if(!m||!S.assets) return;
  try{ toast("جارِ رفع الصورة…"); const r=await S.assets.upload(file); await S.db.doc("machines/"+m.code).update({photo:r.url}); toast("تم تغيير الصورة"); }catch(e){ fail(e,"رفع الصورة"); }
}

/* ---------- exports ---------- */
async function saveXlsx(name, sheets){
  if(!window.XLSX){ toast("مكتبة Excel لم تُحمّل. أعد فتح الصفحة."); return; }
  const wb=XLSX.utils.book_new(); wb.Workbook={Views:[{RTL:true}]};
  for(const [title, rows] of sheets){ const ws=XLSX.utils.json_to_sheet(rows); ws["!cols"]=Object.keys(rows[0]||{}).map(k=>({wch:Math.min(60,Math.max(10,k.length+2,...rows.slice(0,50).map(r=>String(r[k]??"").length/1.6)))})); XLSX.utils.book_append_sheet(wb, ws, title.slice(0,31)); }
  const data=XLSX.write(wb,{type:"array",bookType:"xlsx"});
  if(!S.dl){ toast("التحميل غير متاح في هذا العرض."); return; }
  try{ await S.dl.save({filename:name, data}); }catch(e){ if(e.code!=="declined") toast("تعذّر تحميل الملف."); }
}
const rowsMachines=()=>machinesSorted().map(m=>({"الكود":m.code,"اسم الماكينة":m.nameAr,"الاسم بالإنجليزية":m.nameEn,"القسم":m.dept,"الفئة":m.category,"الشركة المصنعة":m.brand,"بلد المنشأ":m.origin,"الموديل":m.model,"الرقم التسلسلي":m.serial,"سنة الصنع":m.year,"المورد":m.supplier,"الموقع":m.location,"تاريخ الاستلام":m.receivedAt,"تاريخ التشغيل":m.inServiceAt,"تحتاج معايرة":m.calRequired?"نعم":"لا","الحالة":m.status,"الوصف":m.descAr,"Description":m.descEn,"المواصفات الفنية":(m.specs||[]).map(x=>x.k+": "+x.v).join("\n"),"المصادر":sourcesOf(m).map(x=>x.title+(x.url?" – "+x.url:"")).join("\n"),"الكتالوجات":catalogsOf(m).map(c=>c.title+": "+c.url).join("\n"),"عدد الملفات المرفوعة":(m.files||[]).length,"ملاحظات":m.notes}));
const rowsPM=()=>[...S.pm].sort((a,b)=>sortCode(a,b)||a.id.localeCompare(b.id,"en",{numeric:true})).map(t=>{ const r={"الكود":t.code,"الماكينة":mName(t.code),"نشاط الصيانة":t.activity,"الدورية":t.freq,"المسؤول":t.responsible,"احتياطات السلامة":t.safety}; MONTHS.forEach((m,i)=>r[m]=({P:"P",D:"✓",X:"✗"})[cellVal(t,i)]||""); const s=pmStats([t]); r["نسبة التنفيذ"]=s.planned?s.pct+"%":""; return r; });
const rowsOHS=()=>machinesSorted().map(m=>{ const o=S.ohs.get(m.code)||{}; return {"الكود":m.code,"الماكينة":m.nameAr,"المخاطر":arr(o.hazards).join("\n"),"الاحتمالية":o.likelihood??"","الشدة":o.severity??"","الدرجة":o.likelihood?o.likelihood*o.severity:"","المستوى":o.level||"","إجراءات التحكم":arr(o.controls).join("\n"),"مهمات الوقاية":arr(o.ppe).join("\n"),"الطوارئ":arr(o.emergency).join("\n"),"دورية الفحص":o.inspection||"","المسؤول":o.responsible||""}; });
const rowsLogs=()=>[...S.logs].sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(l=>({"التاريخ":l.date,"الكود":l.code,"الماكينة":mName(l.code),"النوع":l.type,"الوصف":l.desc,"قطع الغيار":l.parts,"التوقف (ساعة)":l.downtime,"التكلفة (ج.م)":l.cost,"المنفذ":l.by,"النتيجة":l.result,"أمر الشغل":l.wo}));
const stamp=()=>new Date().toISOString().slice(0,10);

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const t=e.target.closest("button,[data-open],a,label"); if(!t) { if(e.target.matches("[data-scrim]")) closeDrawer(); if(e.target.matches("[data-modal]")) closeModal(); return; }
  if(t.dataset.tab){ S.tab=t.dataset.tab; render(); return; }
  if(t.dataset.cell!==undefined){ e.stopPropagation(); cycleCell(t.dataset.cell, +t.dataset.m); return; }
  if(t.dataset.editPm){ e.stopPropagation(); pmForm(S.pm.find(x=>x.id===t.dataset.editPm)); return; }
  if(t.dataset.editOhs){ e.stopPropagation(); ohsForm(t.dataset.editOhs); return; }
  if(t.dataset.editLog){ e.stopPropagation(); logForm(S.logs.find(x=>x.id===t.dataset.editLog)); return; }
  if(t.dataset.dtabSel){ S.dtab=t.dataset.dtabSel; renderDrawer(); $(".drawer").scrollTop=0; return; }
  if(t.dataset.delFile!==undefined){ const m=S.machines.get(S.open); const i=+t.dataset.delFile; const f=m.files[i];
    confirmBox(`حذف الملف «${f.name}» نهائياً؟`,"حذف",async()=>{ const nf=m.files.filter((_,j)=>j!==i); await S.db.doc("machines/"+m.code).update({files:nf}); try{ await S.assets?.delete(f.id);}catch(_){} toast("تم حذف الملف"); }); return; }
  if(t.dataset.delLink!==undefined){ const m=S.machines.get(S.open); const i=+t.dataset.delLink; const c=catalogsOf(m)[i];
    confirmBox(`حذف رابط «${c.title}»؟`,"حذف",async()=>{ await S.db.doc("machines/"+m.code).update({catalogs:catalogsOf(m).filter((_,j)=>j!==i)}); toast("تم حذف الرابط"); }); return; }
  if(t.dataset.open && t.tagName!=="A"){ openMachine(t.dataset.open, t.dataset.dtab); return; }
  if(t.dataset.lvl!==undefined){ S.ohsLvl=t.dataset.lvl; render(); return; }
  const a=t.dataset.act; if(!a) return;
  const m=S.machines.get(S.open);
  ({ "close":closeDrawer, "close-modal":closeModal, "add-machine":addMachine, "edit-machine":()=>editMachine(m),
     "del-machine":()=>confirmBox(`حذف الماكينة ${m.code} وكل أنشطة صيانتها وتقييم سلامتها؟ سجلات الصيانة السابقة تبقى محفوظة.`,"حذف الماكينة",async()=>{ const code=m.code; closeDrawer(); await Promise.all([S.db.doc("machines/"+code).delete(), S.db.doc("ohs/"+code).delete(), ...S.pm.filter(x=>x.code===code).map(x=>S.db.doc("pm/"+x.id).delete())]); toast("تم حذف الماكينة "+code); }),
     "add-link":()=>linkForm(m), "add-pm":()=>pmForm(null), "add-pm-here":()=>pmForm(null, m.code), "add-log":()=>logForm(null), "add-log-here":()=>logForm(null, m.code),
     "export-machines":()=>saveXlsx(`GE-كتالوج-الماكينات-${stamp()}.xlsx`,[["الماكينات",rowsMachines()]]),
     "export-pm":()=>saveXlsx(`GE-الصيانة-الدورية-${S.year}.xlsx`,[["الصيانة الدورية "+S.year,rowsPM()]]),
     "export-ohs":()=>saveXlsx(`GE-السلامة-والصحة-المهنية-${stamp()}.xlsx`,[["تقييم المخاطر",rowsOHS()]]),
     "export-logs":()=>saveXlsx(`GE-سجل-الصيانة-${stamp()}.xlsx`,[["سجل الصيانة",rowsLogs().length?rowsLogs():[{"التاريخ":""}]]]),
     "export-all":()=>saveXlsx(`GE-نظام-الماكينات-${stamp()}.xlsx`,[["الماكينات",rowsMachines()],["الصيانة الدورية "+S.year,rowsPM()],["السلامة والصحة المهنية",rowsOHS()],["سجل الصيانة",rowsLogs().length?rowsLogs():[{"التاريخ":""}]]]),
  }[a]||(()=>{}))();
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ if(document.querySelector("[data-modal]")) closeModal(); else if(S.open) closeDrawer(); }
  if((e.key==="Enter"||e.key===" ") && e.target.matches("tr[data-open]")){ e.preventDefault(); openMachine(e.target.dataset.open, e.target.dataset.dtab); } });
document.addEventListener("input", e=>{
  const id=e.target.id; const keep=()=>{ const el=$("#"+id); if(el){ el.focus(); const n=el.value.length; try{el.setSelectionRange(n,n);}catch(_){} } };
  if(id==="mq"){ S.mq=e.target.value; render(); keep(); } else if(id==="pmq"){ S.pmQ=e.target.value; render(); keep(); } else if(id==="logq"){ S.logQ=e.target.value; render(); keep(); }
});
document.addEventListener("change", e=>{
  const id=e.target.id;
  if(id==="mdept"){ S.mdept=e.target.value; render(); } else if(id==="pmdept"){ S.pmDept=e.target.value; render(); } else if(id==="pmfreq"){ S.pmFreq=e.target.value; render(); }
  else if(id==="year"){ S.year=+e.target.value; render(); }
  else if(id==="fileIn" && e.target.files.length) uploadFiles([...e.target.files]);
  else if(id==="photoIn" && e.target.files[0]) uploadPhoto(e.target.files[0]);
});
document.addEventListener("dragover", e=>{ const d=e.target.closest?.("#drop"); if(d){ e.preventDefault(); d.classList.add("on"); } });
document.addEventListener("dragleave", e=>{ const d=e.target.closest?.("#drop"); if(d) d.classList.remove("on"); });
document.addEventListener("drop", e=>{ const d=e.target.closest?.("#drop"); if(d){ e.preventDefault(); d.classList.remove("on"); if(e.dataTransfer.files.length) uploadFiles([...e.dataTransfer.files]); } });

/* ---------- boot (GitHub Pages: read-only mirror of the Claude system) ---------- */
render();
(async()=>{
  S.canEdit=false; S.assets=null;
  S.dl={save:async({filename,data})=>{ const url=URL.createObjectURL(new Blob([data])); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000); return {status:"saved"}; }};
  try{
    const r=await fetch("data/data.json?ts="+Date.now(),{cache:"no-store"}); const d=await r.json();
    S.db={readonly:true};
    S.machines=new Map(d.machines.map(m=>[m.code,m])); S.pm=d.pm; S.ohs=new Map(d.ohs.map(o=>[o.code,o])); S.logs=d.logs||[];
    S.loaded={m:true,p:true,o:true,l:true};
    $("#who").textContent="نسخة للعرض · آخر مزامنة "+(d.syncedAt||"");
  }catch(e){ console.error(e); S.db=null; }
  render();
})();
})();
</script>

</body></html>
